<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXIS Dashboard</title>
<style>
  :root { --harbor:#0e1a22; --deck:#132530; --raised:#1b303d; --line:#29414f; --foam:#e4eef1; --tide:#8fa6b1; --lagoon:#3fcdbe; --sand:#e9be6a; --orchid:#a89bff; --bad:#ff7a7a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--harbor); color:var(--foam); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; font-variant-numeric:tabular-nums; }
  h1,h2,h3 { margin:0; font-weight:600; } h2 { font-size:1.4rem; margin-bottom:1rem; }
  button,input,select { font:inherit; color:inherit; } 
  button { background:var(--raised); border:1px solid var(--line); border-radius:6px; padding:.45rem .8rem; cursor:pointer; }
  button:hover { border-color:var(--tide); } button.primary { background:var(--lagoon); color:var(--harbor); border-color:var(--lagoon); font-weight:600; }
  :focus-visible { outline:2px solid var(--lagoon); outline-offset:2px; }
  input,select { background:var(--harbor); border:1px solid var(--line); border-radius:6px; padding:.45rem .6rem; width:100%; }
  .hidden { display:none !important; }
  #login { max-width:340px; margin:14vh auto; padding:0 1rem; display:grid; gap:.8rem; }
  #shell { display:grid; grid-template-columns:15rem minmax(0,1fr); min-height:100vh; }
  aside { background:var(--deck); border-right:1px solid var(--line); padding:1.25rem .75rem; display:flex; flex-direction:column; gap:1rem; position:sticky; top:0; height:100vh; }
  .brand { padding:0 .5rem; } .brand b { font-size:1.25rem; letter-spacing:.04em; } .brand span,.muted { color:var(--tide); display:block; font-size:.9rem; }
  nav { display:grid; gap:2px; flex:1; align-content:start; }
  nav a { padding:.5rem .75rem; border-radius:6px; color:var(--tide); text-decoration:none; }
  nav a:hover { background:rgba(27,48,61,.6); color:var(--foam); }
  nav a[aria-current] { background:var(--raised); color:var(--foam); box-shadow:inset 2px 0 0 var(--lagoon); }
  .badge { display:inline-block; border:1px solid; border-radius:99px; padding:0 .55rem; font-size:.8rem; }
  .badge.admin { color:var(--sand); } .badge.sales_associate { color:var(--lagoon); } .badge.developer { color:var(--orchid); }
  main { padding:2rem 2.25rem; min-width:0; }
  table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:.6rem .5rem; border-bottom:1px solid var(--line); } th { color:var(--tide); font-weight:500; }
  .wrap { overflow-x:auto; }
  .stats { display:flex; gap:2.5rem; margin-bottom:1.75rem; } .stats b { font-size:1.6rem; display:block; }
  .board { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(210px,1fr); gap:.9rem; overflow-x:auto; align-items:start; }
  .col { background:var(--deck); border:1px solid var(--line); border-radius:8px; padding:.75rem; display:grid; gap:.6rem; }
  .card { background:var(--raised); border-radius:6px; padding:.65rem; display:grid; gap:.45rem; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:1rem; }
  .plan { background:var(--deck); border:1px solid var(--line); border-radius:8px; padding:1rem; display:grid; gap:.5rem; } .plan ul { margin:0; padding-left:1.1rem; color:var(--tide); }
  .bar { height:6px; background:var(--raised); border-radius:3px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--lagoon); } .bar i.over { background:var(--bad); }
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
  dialog { background:var(--deck); color:var(--foam); border:1px solid var(--line); border-radius:10px; width:min(420px,92vw); } dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog form { display:grid; gap:.8rem; } dialog label { display:grid; gap:.25rem; color:var(--tide); font-size:.9rem; } .row { display:flex; justify-content:flex-end; gap:.5rem; }
  #toast { position:fixed; bottom:1rem; right:1rem; background:var(--raised); border:1px solid var(--line); padding:.7rem 1rem; border-radius:8px; max-width:340px; }
  @media (max-width:760px) { #shell { grid-template-columns:1fr; } aside { position:static; height:auto; } nav { grid-auto-flow:column; overflow-x:auto; } main { padding:1.25rem; } }
</style>
</head>
<body>
<form id="login">
  <div class="brand"><b>AXIS</b><span>Digital Engineering</span></div>
  <label id="name-row" class="hidden">Name<input id="name" autocomplete="name"></label>
  <label>Email<input id="email" type="email" autocomplete="username" required></label>
  <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
  <button class="primary" id="login-btn">Sign in</button>
  <button type="button" id="mode-toggle">Create an account</button>
  <p id="login-error" class="muted" role="alert"></p>
</form>

<div id="shell" class="hidden">
  <aside>
    <div class="brand"><b>AXIS</b><span>Digital Engineering</span></div>
    <nav id="nav" aria-label="Dashboard"></nav>
    <div><b id="who"></b><span class="muted" id="who-email"></span><span id="role" class="badge"></span><br><button id="signout" style="margin-top:.6rem">Sign out</button></div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" class="hidden" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
